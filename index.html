<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mill Creek's Middle School's Best Moments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <img src="https://mcms.usd232.org/wp-content/uploads/sites/11/2021/07/cropped-cropped-MCMS-Logo-Gold.png" alt="Mill Creek Middle School Logo" class="school-logo">
            <h1>Mill Creek's Middle School's Best Moments</h1>
        </div>
    </header>

    <main>
        <!-- Upload Section -->
        <section class="upload-section">
            <h2>Upload a New Memory</h2>
            <form id="upload-form">
                <div class="form-group">
                    <label for="photo-title">Photo Title or Description:</label>
                    <input type="text" id="photo-title" placeholder="e.g., 8th Grade Graduation Celebration" required>
                </div>
                <div class="form-group">
                    <label for="photo-file">Select Image File:</label>
                    <input type="file" id="photo-file" accept="image/*" required>
                </div>
                <button type="submit" class="submit-btn">Upload Photo</button>
            </form>
        </section>

        <!-- Search Section -->
        <section class="search-section">
            <input type="text" id="search-input" placeholder="Search gallery by title...">
        </section>

        <!-- Gallery Grid Section -->
        <section class="gallery-section">
            <div id="gallery-grid" class="gallery-grid">
                <!-- Dynamic photos will load here from script.js -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mill Creek Middle School. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
