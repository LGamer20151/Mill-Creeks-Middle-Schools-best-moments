<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mill Creek Middle School Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="https://mcms.usd232.org/wp-content/uploads/sites/11/2020/07/cropped-MCMS-Logo-Transparent.png" alt="Mill Creek Middle School Logo" class="logo">
        <h1>Mill Creek Middle School Memories</h1>
    </header>

    <main>
        <section class="upload-section">
            <h2>Upload a Photo</h2>
            <form id="uploadForm">
                <input type="text" id="photoTitle" placeholder="Enter photo title or description" required>
                <input type="file" id="photoFile" accept="image/*" required>
                <button type="submit">Upload Photo</button>
            </form>
        </section>

        <section class="gallery-section">
            <h2>School Gallery</h2>
            <div id="galleryContainer" class="gallery-grid">
                <!-- Photos will appear here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
