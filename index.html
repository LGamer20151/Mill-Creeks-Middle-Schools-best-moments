<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mill Creek Middle School Best Moments</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <header class="bg-blue-600 text-white shadow-md py-6 px-4 mb-8">
        <div class="max-w-5xl mx-auto text-center">
            <h1 class="text-3xl font-bold tracking-tight">Mill Creek Middle School Best Moments</h1>
            <p class="text-blue-100 mt-2">Upload your favorite photos and explore others to</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 pb-12">
        <section class="bg-white rounded-xl shadow-sm p-6 mb-10 border border-slate-100">
            <h2 class="text-xl font-semibold text-slate-800 mb-4">Share a Moment</h2>
            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Your Name</label>
                    <input type="text" id="uploaderName" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Examlpe Alex Jhon">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Select Image</label>
                    <input type="file" id="imageInput" accept="image/*" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Caption</label>
                    <textarea id="imageCaption" rows="2" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="What is happening in this photo?"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition">Upload Moment</button>
            </form>
        </section>

        <section>
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Classmate Gallery</h2>
            <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <p class="text-slate-500 col-span-full text-center py-8">Loading shared moments...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
